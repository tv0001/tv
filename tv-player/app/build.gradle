plugins {
    id 'com.android.application'
}

// 兼容包：gradle assembleRelease -Plegacy 打出最低 Android 5.0 的包（app-legacy-release-unsigned.apk），给装不了
// 主版本（最低 8.0）的老电视、老盒子用。不带这个参数时构建和以前完全一样。两种包共用 build 目录，打另一种时上一种的
// 产物会被 Gradle 清掉，所以打完一种先签名拷走再打另一种。兼容包的自动更新读 app-version-legacy.json（见 AppUpdate），
// 不会被升级成装不上的主版本
// -Plegacy 或 -Plegacy=true 都算；-Plegacy=false 不算（只写 -Plegacy 时值是空字符串，Groovy 里空串是假，不能用 ?: 判断）
def legacy = project.hasProperty('legacy') && project.property('legacy').toString() != 'false'
if (legacy) {
    base.archivesName = 'app-legacy'
}

android {
    namespace = 'com.tv.player'
    compileSdk = 35

    defaultConfig {
        applicationId = 'com.tv.player'
        minSdk = legacy ? 21 : 26
        targetSdk = 35
        versionCode = (project.findProperty('appVersionCode') ?: '41').toString().toInteger()
        versionName = (project.findProperty('appVersionName') ?: '1.0.40').toString()
        buildConfigField 'boolean', 'LEGACY', legacy.toString()
        // 唯一的原生库是 ffmpeg 音频解码：电视盒子和手机基本都是 ARM，只打这两种（少 3MB）。没有 ARM 转译的 x86 设备装不上
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // 界面只有中文：依赖库（material、appcompat 等）带的几十种语言的翻译不打进包里，其余语言的系统回退到默认（英文）
    androidResources {
        localeFilters += ['zh-rCN', 'zh-rHK', 'zh-rTW']
    }

    // bouncycastle（smbj 用它算 NTLM）自带的后量子算法数据表和证书提示文字用不到，不打进包里
    packaging {
        resources {
            excludes += ['org/bouncycastle/pqc/**', 'org/bouncycastle/x509/*.properties']
        }
        // ffmpeg 原生库压缩后放进包里（默认是不压缩、直接从包里加载）：安装包小 1MB 多，代价是安装时系统要解压一份到存储里
        jniLibs {
            useLegacyPackaging = true
        }
    }

    // 兼容包专用的资源（老系统认不了的图标、layer-list 写法，以及根证书包）：放在构建类型的资源目录里，同名时盖过 main 里的
    if (legacy) {
        sourceSets {
            debug.res.srcDirs += 'src/legacy/res'
            release.res.srcDirs += 'src/legacy/res'
            // 老系统缺的根证书（见 LegacyTls）
            debug.resources.srcDirs += 'src/legacy/resources'
            release.resources.srcDirs += 'src/legacy/resources'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        // 兼容包：smbj 等库用了 Java 8 的集合方法（Set.removeIf、Map.computeIfAbsent）和 java.time，Android 7.0 以下没有，
        // 不补的话连 SMB 会抛 NoSuchMethodError。主版本不开（8.0 以上系统都有）
        if (legacy) coreLibraryDesugaringEnabled = true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'androidx.fragment:fragment-ktx:1.8.6'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.media3:media3-exoplayer:1.6.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.6.1'
    implementation 'androidx.media3:media3-ui:1.6.1'
    // 播放器走 OkHttp：和测速、解析共用一个连接池（见 Http.playerClient）
    implementation 'androidx.media3:media3-datasource-okhttp:1.6.1'
    // AC3 / EAC3 / DTS / TrueHD 等音轨的软解（设备没有对应硬解时才用）。Jellyfin 按 media3 版本编译的官方 ffmpeg 扩展；
    // 它的 pom 写着依赖 media3 1.7.1，会把播放器整体顶上去，所以不要传递依赖，解码器基础库按本项目的版本单独引入
    implementation('org.jellyfin.media3:media3-ffmpeg-decoder:1.6.1+2') { transitive = false }
    implementation 'androidx.media3:media3-decoder:1.6.1'
    // 网络存储的 SMB（Windows 共享、NAS）
    implementation 'com.hierynomus:smbj:0.15.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'io.coil-kt:coil:2.7.0'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'androidx.work:work-runtime-ktx:2.10.0'
    implementation 'androidx.tvprovider:tvprovider:1.0.0'

    if (legacy) coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    testImplementation 'junit:junit:4.13.2'
    // Android's own org.json is a stub in unit tests; the real one lets the JSON code run on the JVM.
    testImplementation 'org.json:json:20240303'
}
